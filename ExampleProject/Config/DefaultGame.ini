[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=SuperEmbedder-Unreal - Example
ProjectID=4713D34F38374DCFAC395CF3B45C4959

; The plugin's settings, at their defaults, written out so the example shows where they live. The library reads
; the model files itself, so they sit in Content/SuperEmbedder/ and are staged loose, never in the pak.
[/Script/SuperEmbedderUnreal.SuperEmbedderSettings]
ModelFile=Content/SuperEmbedder/model.sslm
TokenizerFile=Content/SuperEmbedder/tokenizer.sslm
MaxConcurrency=1
MaxQueryTokens=256
MaxDocumentTokens=256

; The example has no /Game content: its rows and queries are in code and its vector set is baked at run time,
; so there is no demo folder to cook. The map is the engine's Entry map, cooked explicitly because nothing
; references it. The model folder is staged as a non-asset directory.
[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+DirectoriesToAlwaysStageAsNonUFS=(Path="SuperEmbedder")
