name: coherence-checks

# File and text checks that need only Python, so they run on a standard hosted runner. The Unreal build,
# the host suites (which need SuperEmbedder's synthetic model pair) and the MSVC coexistence checks are not
# here; CONTRIBUTING.md has them.
#
# TRIGGER: manual only. Dispatch it from the Actions tab, or with
#   gh workflow run coherence-checks.yml --ref <branch>

on:
  workflow_dispatch:

env:
  PLUGIN_DIR: Plugins/SuperEmbedderUnreal

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Vendored trees match their manifests
        run: python "$PLUGIN_DIR/ci/check_vendored_tree_matches_manifest.py" --plugin-root "$PLUGIN_DIR"
      - name: One wrapper per compiled vendored source
        run: python "$PLUGIN_DIR/ci/check_vendored_wrappers_complete.py" --plugin-root "$PLUGIN_DIR"
      - name: Generated configuration headers are current
        run: python "$PLUGIN_DIR/ci/generate_semb_config.py" --plugin-root "$PLUGIN_DIR" --check
      - name: MCP toolset surface and the example's layout
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider Plugins/SuperEmbedderUnrealMCP/ci/tests ExampleProject/tests
